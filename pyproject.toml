[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "marketsensing"
version = "0.1.0"
description = "Oil & Gas Market Sensing and Trading Signal Platform"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "hmmlearn>=0.3",
    "mlflow>=2.0",
    "delta-spark>=3.0",
    "pyspark>=3.5",
    "azure-eventhub>=5.11",
    "requests>=2.31",
    "structlog>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.5",
    "httpx>=0.24",  # for FastAPI test client
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
