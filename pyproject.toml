[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "marketsensing"
version = "0.1.0"
description = "Oil & Gas trading signal platform"
requires-python = ">=3.11"
authors = [{name = "MarketSensing Team"}]

[project.dependencies]
# Core
python = "^3.11"

# FastAPI + HTTP
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
pydantic = "^2.0"

# Database
asyncpg = "^0.28.0"  # PostgreSQL async driver
psycopg2-binary = "^2.9.0"  # PostgreSQL driver for sync code

# Configuration
pyyaml = "^6.0"

# ML
lightgbm = "^4.0.0"
numpy = "^1.24.0"
pandas = "^2.0.0"

# Logging
structlog = "^23.0.0"

# Neo4j (optional, for knowledge graph)
neo4j = "^5.14.0"

# Testing
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"

# Code quality
ruff = "^0.1.0"
black = "^23.0.0"
mypy = "^1.0.0"

[project.optional-dependencies]
enterprise = [
    "pyspark>=3.4.0",
    "delta-spark>=2.0.0",
    "mlflow>=2.0.0",
    "azure-eventhub>=5.11.0",
    "databricks-sql-connector>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # Line too long (handled by Black)

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Relax for MVP
