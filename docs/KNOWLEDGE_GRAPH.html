<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketSensing: Business Data Flow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .graph-container {
      flex: 1;
      position: relative;
      background: rgba(15, 23, 42, 0.9);
      overflow-x: auto;
      overflow-y: hidden;
    }

    .flow-wrapper {
      padding: 40px;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 60px;
      min-width: min-content;
    }

    .flow-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
    }

    .section-title {
      color: #60a5fa;
      font-size: 1.3em;
      font-weight: bold;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 3px solid #3b82f6;
      text-align: center;
      width: 100%;
      min-width: 220px;
    }

    .sources-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
      padding-right: 10px;
      flex-shrink: 0;
      width: 260px;
    }

    .source-box {
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.2), rgba(249, 115, 22, 0.05));
      border: 2px solid #f97316;
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .source-box:hover {
      border-color: #fb923c;
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.4), rgba(249, 115, 22, 0.1));
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(249, 115, 22, 0.2);
    }

    .source-name {
      color: #fb923c;
      font-weight: bold;
      font-size: 0.9em;
      margin-bottom: 4px;
    }

    .source-acronym {
      color: #f59e0b;
      font-size: 0.7em;
      font-style: italic;
      margin-bottom: 6px;
    }

    .source-desc {
      color: #cbd5e1;
      font-size: 0.75em;
      line-height: 1.4;
    }

    .arrow {
      font-size: 2.5em;
      color: #3b82f6;
      flex-shrink: 0;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .models-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
      width: 280px;
    }

    .model-box {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05));
      border: 2px solid #10b981;
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .model-box:hover {
      border-color: #6ee7b7;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.4), rgba(16, 185, 129, 0.1));
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.2);
    }

    .model-name {
      color: #6ee7b7;
      font-weight: bold;
      font-size: 0.95em;
      margin-bottom: 6px;
    }

    .model-desc {
      color: #cbd5e1;
      font-size: 0.75em;
      line-height: 1.4;
    }

    .output-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
      width: 240px;
    }

    .output-box {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(6, 182, 212, 0.05));
      border: 2px solid #06b6d4;
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .output-box:hover {
      border-color: #67e8f9;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.4), rgba(6, 182, 212, 0.1));
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(6, 182, 212, 0.2);
    }

    .output-label {
      color: #94a3b8;
      font-size: 0.75em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .output-value {
      color: #67e8f9;
      font-weight: bold;
      font-size: 0.9em;
    }

    .panel {
      width: 380px;
      background: rgba(15, 23, 42, 0.95);
      border-left: 3px solid #334155;
      padding: 30px;
      overflow-y: auto;
      max-height: 100vh;
    }

    .panel-header {
      margin-bottom: 20px;
      border-bottom: 2px solid #334155;
      padding-bottom: 15px;
    }

    .panel-title {
      color: #60a5fa;
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .panel-type {
      color: #94a3b8;
      font-size: 0.85em;
      text-transform: uppercase;
    }

    .panel-section {
      margin-bottom: 20px;
    }

    .panel-section-title {
      color: #3b82f6;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.85em;
      margin-bottom: 10px;
    }

    .panel-text {
      color: #cbd5e1;
      font-size: 0.9em;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .panel-list {
      list-style: none;
      margin-left: 0;
    }

    .panel-list li {
      color: #cbd5e1;
      font-size: 0.9em;
      margin: 8px 0;
      padding-left: 15px;
      position: relative;
    }

    .panel-list li:before {
      content: "→";
      position: absolute;
      left: 0;
      color: #3b82f6;
      font-weight: bold;
    }

    .panel-stat {
      background: rgba(59, 130, 246, 0.1);
      border-left: 3px solid #3b82f6;
      padding: 12px;
      margin: 10px 0;
      border-radius: 4px;
    }

    .panel-stat-label {
      color: #94a3b8;
      font-size: 0.8em;
      text-transform: uppercase;
    }

    .panel-stat-value {
      color: #60a5fa;
      font-weight: bold;
      font-size: 1.1em;
    }

    .signal-metric {
      background: rgba(16, 185, 129, 0.1);
      border-left: 3px solid #10b981;
      padding: 12px;
      margin: 10px 0;
      border-radius: 4px;
    }

    .metric-name {
      color: #6ee7b7;
      font-weight: bold;
      font-size: 0.95em;
      margin-bottom: 5px;
    }

    .metric-description {
      color: #cbd5e1;
      font-size: 0.85em;
      line-height: 1.5;
    }

    .empty-state {
      text-align: center;
      color: #94a3b8;
      padding: 40px 20px;
      font-size: 0.95em;
      line-height: 1.8;
    }

    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(51, 65, 85, 0.2);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(59, 130, 246, 0.5);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(59, 130, 246, 0.7);
    }
  </style>
</head>
<body>

<div class="graph-container">

<div class="panel">

// Render sources
function renderSources() {
  const col = document.getElementById('sourcesColumn');
  col.innerHTML = sources.map(s => `
    <div class="source-box" onclick="showSourceDetails('${s.id}')">
      <div class="source-name">${s.name}</div>
      <div class="source-acronym">${s.acronym}</div>
      <div class="source-desc">${s.desc}</div>
    </div>
  `).join('');
}

// Render models
function renderModels() {
  const col = document.getElementById('modelsColumn');
  col.innerHTML = models.map(m => `
    <div class="model-box" onclick="showModelDetails('${m.id}')">
      <div class="model-name">${m.name}</div>
      <div class="model-desc">${m.desc}</div>
    </div>
  `).join('');
}

// Render output
function renderOutput() {
  const col = document.getElementById('outputColumn');
  col.innerHTML = traders.map((t, i) => `
    <div class="output-box">
      <div class="output-label">${t.label}</div>
      <div class="output-value">${t.value}</div>
    </div>
  `).join('');
}

// Show source details
function showSourceDetails(id) {
  const source = sources.find(s => s.id === id);
  if (!source) return;

  const panel = document.getElementById('panelContent');
  panel.innerHTML = `
    <div class="panel-header">
      <div class="panel-title">${source.name}</div>
      <div class="panel-type">${source.category}</div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">Full Name</div>
      <div class="panel-text">${source.fullName}</div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">What We Get</div>
      <div class="panel-text">${source.desc}</div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">Update Frequency</div>
      <div class="panel-stat">
        <div class="panel-stat-label">How Often</div>
        <div class="panel-stat-value">${source.frequency}</div>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">Business Impact</div>
      <div class="panel-text">${source.impact}</div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title">Used By These Models</div>
      <ul class="panel-list">
        ${source.usedBy.map(m => `<li>${m}</li>`).join('')}
      </ul>
    </div>
  `;
}

// Show model details with signal descriptions

      <ul class="panel-list">
        ${model.sources.map(s => `<li>${s}</li>`).join('')}
      </ul>
    </div>
  `;
}

// Initialize
renderSources();
renderModels();
renderOutput();
</script>
